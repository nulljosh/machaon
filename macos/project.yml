name: HealstackMac
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    macOS: '14.0'
settings:
  SWIFT_VERSION: '6.0'
  MARKETING_VERSION: '2.3.5'
  CURRENT_PROJECT_VERSION: '202610251236'
  DEVELOPMENT_TEAM: QMM486NPYC
  CODE_SIGN_STYLE: Automatic
targets:
  Healstack:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - '*.xcodeproj'
          - '*.yml'
          - README.md
          - CLAUDE.md
          - Checks
          - icon.svg
          - architecture.svg
      - path: ../ios/Models/BiometricEntry.swift
      - path: ../ios/Models/DoseEntry.swift
      - path: ../ios/Models/HealthEntry.swift
      - path: ../ios/Models/LabResult.swift
      - path: ../ios/Models/MyMedication.swift
      - path: ../ios/Models/Substance.swift
      - path: ../ios/Data/SubstanceDatabase.swift
      - path: ../ios/Services/DataStore.swift
      - path: ../ios/Services/InsightEngine.swift
      - path: ../ios/Services/AuthService.swift
      - path: ../ios/Services/API.swift
      - path: ../ios/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Machaon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        CFBundleURLTypes:
          - CFBundleURLName: com.heyitsmejosh.dose
            CFBundleURLSchemes:
              - healstack
              - dose
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ''
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: HealstackMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.applesignin:
          - Default
    settings:
      CODE_SIGN_ENTITLEMENTS: HealstackMac.entitlements
      PRODUCT_NAME: Machaon
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose
      SUPABASE_URL: https://tjsxsqlxjmanwvmywwvw.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqc3hzcWx4am1hbnd2bXl3d3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTc0MDEsImV4cCI6MjA4NjA3MzQwMX0.LphLfho3wdQC20MhtcnBpzQUNuBoTOobrugQbNGxc68
schemes:
  Healstack:
    build:
      targets:
        Healstack: all
    run:
      config: Debug
