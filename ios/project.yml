name: Healstack
packages:
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: "0.59.1"
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  SWIFT_VERSION: '6.0'
  MARKETING_VERSION: '2.4.1'
  CURRENT_PROJECT_VERSION: '202610211503'
  DEVELOPMENT_TEAM: QMM486NPYC
  CODE_SIGN_STYLE: Automatic
targets:
  Healstack:
    type: application
    platform: iOS
    sources:
      # Icon Composer document, Liquid Glass layers. AppIcon.appiconset stays as the flat fallback.
      - path: Healstack.icon
        type: file
        buildPhase: resources
      # Listed one by one: a `path: .` source made xcodegen put Data, Models, Services and Views in two groups,
      # which Xcode 27 refuses to open.
      - Data
      - Models
      - Services
      - Views
      - Assets.xcassets
      - CrossPlatform.swift
      - HealstackApp.swift
      - OnboardingSlides.swift
      - OnboardingView.swift
      - WhatsNewSheet.swift
    dependencies:
      - sdk: HealthKit.framework
      - target: DoseWidgetExtension
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
    entitlements:
      path: Healstack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.heyitsmejosh.dose
        com.apple.developer.applesignin:
          - Default
    settings:
      # iPhone only: was Universal but iPad UI was never actually designed for iPad Pro
      # (blocked App Store submission needing iPad Pro 12.9" screenshots, 2026-09-12).
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose
      INFOPLIST_KEY_CFBundleDisplayName: Machaon
      CODE_SIGN_ENTITLEMENTS: Healstack.entitlements

  HealstackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Healstack
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose.tests
      GENERATE_INFOPLIST_FILE: YES

  HealstackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Healstack
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose.uitests
      GENERATE_INFOPLIST_FILE: YES

  DoseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DoseWidget
    entitlements:
      path: DoseWidget/DoseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heyitsmejosh.dose
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.dose.widget
      INFOPLIST_FILE: DoseWidget/Info.plist
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Healstack:
    build:
      targets:
        Healstack: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealstackTests
  HealstackUITests:
    build:
      targets:
        Healstack: all
        HealstackUITests: all
    test:
      config: Debug
      targets:
        - HealstackUITests
